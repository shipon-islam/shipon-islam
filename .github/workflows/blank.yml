name: 🐍 Generate contribution snake

# Publishes two SVGs to an "output" branch; the README reads them from there:
#   https://raw.githubusercontent.com/shipon-islam/shipon-islam/output/github-snake-dark.svg
#
# First run: Settings → Actions → General → Workflow permissions →
# "Read and write permissions" (otherwise the publish step fails with 403).

on:
  # Refresh every 12 hours so the snake never goes stale.
  schedule:
    - cron: "0 */12 * * *"
  # Run it by hand from the Actions tab (Run workflow).
  workflow_dispatch:
  # Also run as soon as this file lands on main.
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish them to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
